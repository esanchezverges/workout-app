name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure and app
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters image="$IMAGE" location="${{ vars.AZURE_LOCATION }}" \
              sqlAdminObjectId="${{ vars.AZURE_SQL_ADMIN_ID }}" sqlAdminLogin="${{ vars.AZURE_SQL_ADMIN_LOGIN }}" \
            --query properties.outputs.url.value --output tsv
      - name: Run database migrations
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          group="${{ vars.AZURE_RESOURCE_GROUP }}"
          execution=$(az containerapp job start -n workout-migrate -g "$group" --query name -o tsv)
          for _ in $(seq 1 60); do
            status=$(az containerapp job execution show -n workout-migrate -g "$group" \
              --job-execution-name "$execution" --query properties.status -o tsv)
            echo "$execution: $status"
            [ "$status" = Succeeded ] && exit 0
            [ "$status" = Failed ] && exit 1
            sleep 10
          done
          echo "Timed out waiting for migrations" && exit 1
